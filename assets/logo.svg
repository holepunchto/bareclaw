<svg width="680" height="200" viewBox="0 0 680 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bareclaw">
  <title>bareclaw</title>
  <defs>
    <!-- hand-inked / brushstroke roughening of edges -->
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- mark: dark bear paw on a rough cream disc -->
  <g transform="translate(20,20)" filter="url(#rough)">
    <circle cx="80" cy="84" r="76" fill="#ECE1CE"/>

    <g fill="#3A2A20">
      <!-- claws: curved talons fanning above each toe -->
      <g transform="translate(43,61) rotate(-26)"><path d="M-4 0 C-4 -8,-2 -15,0 -17 C2 -15,4 -8,4 0 Z"/></g>
      <g transform="translate(67,45) rotate(-9)"><path d="M-4 0 C-4 -8,-2 -15,0 -17 C2 -15,4 -8,4 0 Z"/></g>
      <g transform="translate(93,45) rotate(9)"><path d="M-4 0 C-4 -8,-2 -15,0 -17 C2 -15,4 -8,4 0 Z"/></g>
      <g transform="translate(117,61) rotate(26)"><path d="M-4 0 C-4 -8,-2 -15,0 -17 C2 -15,4 -8,4 0 Z"/></g>

      <!-- toe pads -->
      <ellipse cx="48" cy="76" rx="11" ry="14" transform="rotate(-16 48 76)"/>
      <ellipse cx="69" cy="60" rx="11" ry="15" transform="rotate(-6 69 60)"/>
      <ellipse cx="91" cy="60" rx="11" ry="15" transform="rotate(6 91 60)"/>
      <ellipse cx="112" cy="76" rx="11" ry="14" transform="rotate(16 112 76)"/>

      <!-- palm pad -->
      <path d="M48 100 C44 84, 66 80, 80 80 C94 80, 116 84, 112 100
               C120 122, 104 140, 80 140 C56 140, 40 122, 48 100 Z"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(212,0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="106" font-size="62" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#3A2A20">bare</tspan><tspan fill="#C2762E">claw</tspan>
    </text>
    <text x="2" y="142" font-size="20" font-weight="600" fill="#8A7660" letter-spacing="0.2">
      picoclaw for Bare
    </text>
    <g transform="translate(2,160)" font-size="13" font-weight="700" letter-spacing="1.5">
      <rect x="0" y="0" width="148" height="24" rx="12" fill="#3A2A20" fill-opacity="0.08"/>
      <text x="14" y="16" fill="#3A2A20">CLAUDE EXPERIMENT</text>
    </g>
  </g>
</svg>
